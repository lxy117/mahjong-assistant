name: Build Android App

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential git curl wget unzip openjdk-17-jdk

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install buildozer

    - name: Build Android App
      run: |
        # Show current directory and files
        ls -la
        
        # Initialize buildozer if needed
        if [ ! -f "buildozer.spec" ]; then
          buildozer init
        fi
        
        # Show buildozer.spec content
        cat buildozer.spec
        
        # Build the app with verbose output
        buildozer android debug verbose
        
        # Check if APK was generated
        find . -name "*.apk" -type f
        
        # Show bin directory content
        ls -la bin/ || echo "bin directory not found"

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: mahjong-assist-apk
        path: |
          bin/*.apk
          ./*.apk
        if-no-files-found: warn
