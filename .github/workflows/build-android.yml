name: Build Android App

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential git curl wget unzip openjdk-17-jdk

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install buildozer

    - name: Prepare build environment
      run: |
        # Show current directory and files
        echo "Current directory: $(pwd)"
        echo "Files in current directory:"
        ls -la
        
        # Check if main.py exists
        if [ -f "main.py" ]; then
          echo "main.py exists, showing first 50 lines:"
          head -50 main.py
        else
          echo "ERROR: main.py not found!"
          exit 1
        fi
        
        # Check if buildozer.spec exists
        if [ -f "buildozer.spec" ]; then
          echo "buildozer.spec exists, showing content:"
          cat buildozer.spec
        else
          echo "ERROR: buildozer.spec not found!"
          exit 1
        fi

    - name: Build Android App
      run: |
        # Build the app with verbose output
        echo "Starting build process..."
        buildozer android debug verbose 2>&1 | tee build.log
        # Set environment variables
        export ANDROID_HOME=~/Android/Sdk
        export ANDROID_NDK_HOME=~/Android/Sdk/ndk/25.2.9519653
        export PATH=$PATH:~/Android/Sdk/cmdline-tools/latest/bin:~/Android/Sdk/platform-tools
        
        # Build the app
        buildozer android debug
        
        # Check build results
        echo "Build completed, checking results:"
        ls -la
        ls -la bin/ || echo "bin directory not found"
        
        # Find any APK files
        echo "Searching for APK files:"
        find . -name "*.apk" -type f
        
        # Show build.log if it exists
        if [ -f "build.log" ]; then
          echo "Last 100 lines of build.log:"
          tail -100 build.log
        fi

    - name: Upload build logs
      uses: actions/upload-artifact@v4
      with:
        name: build-logs
        path: build.log
        if-no-files-found: warn

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: mahjong-assist-apk
        path: bin/*.apk
        if-no-files-found: warn
